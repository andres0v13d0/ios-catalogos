workflows:
  ios-prod:
    name: FLY+ iOS (prod)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: catalogos
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "6826934332"
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Preparar firma
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.flystock.revendedores" \
            --type IOS_APP_STORE --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
      - name: Aplicar perfiles
        script: xcode-project use-profiles
      - name: Número de build
        script: |
          BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((BUILD + 1))" >> $CM_ENV
      - name: Compilar IPA
        script: |
          flutter build ipa --release --flavor prod \
            --dart-define-from-file=env/prod.json \
            --build-name=1.0.2 --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - catalogos/build/ios/ipa/*.ipa
      - /Users/builder/clone/catalogos/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
