name: catalogos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Tipografía Poppins de la identidad FlyStock (tarea 0.3).
  # Versión fija (pin) para builds reproducibles.
  google_fonts: 9.0.0

  # Cliente HTTP de la capa de red (tarea 0.4). Dio soporta interceptores
  # (Auth/Error/AppCheck) y permite inyectar un HttpClientAdapter mock en tests.
  # Versión fija (pin) para builds reproducibles.
  dio: 5.11.1

  # Gestión de estado (diseño §2.2). Riverpod expone Notifier/AsyncNotifier,
  # inyección de dependencias testeable y estados async (loading/data/error).
  # En Fase 0.5 lo usamos para el `authStateProvider` placeholder que alimenta
  # el guard de navegación. Versión fija (pin) para builds reproducibles.
  flutter_riverpod: 3.4.3

  # Navegación declarativa con rutas tipadas y redirect guards (diseño §2.3).
  # Soporta el guard de auth (placeholder en 0.5) y las rutas base /login y
  # /home. Versión fija (pin) para builds reproducibles.
  go_router: 18.0.2

  # Formateo/localización de números y fechas (diseño §5 "Redondeo: COP sin
  # decimales ... NumberFormat es-CO"). Se usa en `core/utils/money.dart` para
  # formatear precios en pesos colombianos (tarea 0.6). Versión fija (pin).
  intl: 0.20.3

  # Caché local clave/valor para lectura offline (diseño §2.5 y §8). Se elige
  # Hive sobre drift porque no requiere codegen, inicializa en una línea y
  # permite tests sin dispositivo real (directorio temporal). La caché completa
  # de catálogos (stale-while-revalidate) se construye en la tarea 1.18; aquí
  # solo se inicializa la capa con una abstracción mínima. Versión fija (pin).
  hive: 2.2.3

  # Integración de Hive con Flutter: `Hive.initFlutter()` resuelve el directorio
  # de documentos de la app para persistir las cajas (tarea 0.6). Versión fija.
  hive_flutter: 1.1.0
  firebase_core: ^4.15.0

  # Firebase Phone Auth (tareas 1.9/1.10): verifyPhoneNumber (envío OTP),
  # PhoneAuthCredential + signInWithCredential, user.getIdToken(). Se abstrae
  # tras `PhoneAuthService` para poder mockearlo en tests (sin Firebase real).
  # Versión fija (pin) resuelta compatible con firebase_core ^4.x.
  firebase_auth: 6.7.0

  # Firebase App Check (tarea 1.11): provee el token para la cabecera
  # `X-Firebase-AppCheck`. En dev se activa con proveedores DEBUG; en prod con
  # Play Integrity (Android) / App Attest (iOS). Se abstrae tras
  # `AppCheckTokenSource` para inyectar un fake en tests. Versión fija (pin).
  firebase_app_check: 0.4.8

  # Almacenamiento seguro de metadatos de sesión del lado de la app (tarea
  # 1.12): Keychain (iOS) / Keystore+EncryptedSharedPreferences (Android).
  # NOTA DE DISEÑO: NO guardamos el idToken aquí (es efímero y lo gestiona
  # firebase_auth, que ya persiste su propio usuario entre reinicios); solo
  # persistimos metadatos del perfil (reseller id/nombre, estado de onboarding).
  # El idToken se deriva on-demand con `currentUser.getIdToken()`.
  # Versión fija (pin) resuelta compatible con el SDK del proyecto.
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Adaptador de mock para Dio: permite stubear respuestas HTTP en tests
  # unitarios sin red real (tarea 0.4). Versión fija (pin).
  http_mock_adapter: 0.6.1

  # Permite inyectar un directorio temporal como ruta de `path_provider` en los
  # tests de la caché Hive, evitando depender de un dispositivo real (tarea
  # 0.6). Versión fija (pin).
  path_provider_platform_interface: 2.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
