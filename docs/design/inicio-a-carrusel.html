<title>FLYmovil · Inicio "Tus catálogos" (referencia de diseño)</title>
<!--
  REFERENCIA DE DISEÑO PARA FLUTTER. Dos estados de la pantalla de inicio, lado a lado:
  1) VARIOS CATÁLOGOS: carrusel con la tarjeta siguiente asomando (escala 0.94) y puntos.
  2) UN SOLO CATÁLOGO: tarjeta única, sin puntos, sin tarjeta asomando.
  Marco: 390x844 dp. Posiciones, tamaños, radios, sombras y colores están en estilos en línea:
  replícalos 1:1. Los banners (degradados con círculos) y los logos (círculos con iniciales)
  son MARCADORES DE POSICIÓN: en la app real el banner es una imagen (cover) y el logo la imagen
  del proveedor; los degradados y las iniciales solo son el respaldo cuando no hay imagen.
  Los círculos decorativos NO se dibujan sobre banners reales.
  Puntos del carrusel: activo = píldora 26x8 #001634; siguiente = círculo 8 #C5D3E8; borde = círculo 5.
-->
